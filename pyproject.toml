[project]
name = "omr-ingestor"
version = "0.1.0"
description = "Local pipeline: sheet-music PDF -> OMR -> MuseScore .mscz with the right instrument and style"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18"]

[project.scripts]
omr-ingestor = "omr_ingestor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omr_ingestor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
